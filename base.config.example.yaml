# 이 파일을 base.config.yaml로 복사한 뒤 실제 값으로 채워서 사용합니다.
# base.config.yaml은 개인 경로가 포함되므로 커밋하지 않습니다(.gitignore 대상).
obsidian:
  vault:
    toNotion:
      name: 'MyVault'                          # 옵시디언 볼트 이름 (obsidian:// URI 생성에 사용)
      path: '/absolute/path/to/vault'          # 볼트 루트 절대경로
      target: 'Daily'                          # 마이그레이션 소스 디렉토리 (볼트 기준 상대경로, 하위 디렉토리 포함 재귀 스캔)
      effectiveDate: '2025-01-01'              # 이 날짜 이후(포함)의 노트만 노션으로 이관
      exclude:                                 # 스캔에서 제외할 glob 패턴 (gitignore처럼 제외 대상만 지정)
        - 'templates/*'                        # target 기준 상대경로 또는 파일명에 매칭
        - '메모용 노트.md'
    fromNotion:
      name: 'MyVault'
      path: '/absolute/path/to/vault'
      target: 'Daily-NotionBackup'             # 백업 목적지. 반드시 toNotion.target과 다른 디렉토리
notion:
  db:
    url: 'https://www.notion.so/<32자리ID>?v=...'  # 대상 데이터베이스 URL (ID는 자동 추출)
    name: 'MyDatabase'
pipeline:
  plugin: 'MyPlugin'                             # 사용할 변환 플러그인. 생략 시: 등록된 플러그인이 하나면 그것, 없으면 내장 'default'
  # 아래 규칙들은 내장 'default' 플러그인 전용입니다 (코드 수정 없이 yaml로 규칙 정의).
  # 생략하면 일반 관례로 폴백: 파일명 'YYYY-MM-DD' -> frontmatter 'date' -> 'created', 매핑 없음.
  # dateFrom:                                    # 날짜 파생 체인 (위에서부터 시도)
  #   - fileLayout: 'DN_060102'                  # 파일명을 Go 시간 레이아웃으로 해석
  #   - frontmatterKey: 'created_date'           # frontmatter 값에서 날짜 파싱
  # mapping:                                     # 노션 속성 매핑
  #   - notionProperty: 'Type'
  #     value: 'Todo'                            # 고정값 주입
  #   - notionProperty: 'Status'
  #     frontmatter: 'status'                    # frontmatter 키 매핑
  #     values: { 'wip': 'In progress' }         # 값 변환표 (선택)
  #     default: 'Done'                          # 폴백 값 (선택)
